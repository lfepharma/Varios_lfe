<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Profesionales</title>
<style>
  :root{
    --bg: #FAF8F2;
    --card: #FFFFFF;
    --ink: #1A2420;
    --ink-soft: #4C5A55;
    --teal: #17453D;
    --teal-deep: #0E2E29;
    --yellow: #F7B500;
    --yellow-deep: #E5A400;
    --sage: #C7DAD1;
    --sage-line: #EFE3C2;
    --coral: #D65A44;
    --coral-bg: #FBEAE6;
    --ok: #2E7D5B;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(23,69,61,0.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(23,69,61,0.05) 0%, transparent 40%);
    font-family: -apple-system, "Segoe UI", "IBM Plex Sans", Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
  }

  .card{
    width:100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(14,46,41,0.04), 0 20px 50px -20px rgba(14,46,41,0.25);
    overflow: hidden;
    border: 1px solid var(--sage-line);
  }

  .header{
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-deep) 100%);
    padding: 30px 36px 26px;
    color: var(--teal-deep);
    display:flex;
    align-items:center;
    gap:18px;
  }

  .logo-slot{
    width: 96px;
    height: 96px;
    border-radius: 14px;
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(14,46,41,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    padding: 10px;
  }
  .logo-slot img{
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .header-text h1{
    font-family: Georgia, "Source Serif Pro", serif;
    font-size: 21px;
    margin: 0 0 4px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--teal-deep);
  }
  .header-text p{
    margin:0;
    font-size: 13.5px;
    color: rgba(14,46,41,0.65);
    font-weight: 500;
  }

  form{
    padding: 32px 36px 36px;
  }

  .field{
    margin-bottom: 20px;
    position: relative;
  }

  label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  input, select{
    width:100%;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--sage-line);
    background: #FCFDFC;
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus{
    outline:none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(23,69,61,0.10);
  }

  input.error{
    border-color: var(--coral);
    background: var(--coral-bg);
  }
  input.error:focus{
    box-shadow: 0 0 0 3px rgba(214,90,68,0.14);
  }

  .error-msg{
    display:none;
    align-items:center;
    gap:6px;
    color: var(--coral);
    font-size: 13px;
    margin-top: 7px;
    font-weight: 500;
  }
  .error-msg.show{ display:flex; }

  .ok-msg{
    display:none;
    align-items:center;
    gap:6px;
    color: var(--ok);
    font-size: 13px;
    margin-top: 7px;
    font-weight: 500;
  }
  .ok-msg.show{ display:flex; }

  .hint{
    font-size: 12px;
    color: #94A39D;
    margin-top: 6px;
  }

  button{
    width:100%;
    margin-top: 8px;
    padding: 13px;
    border-radius: 9px;
    border: none;
    background: var(--yellow);
    color: var(--teal-deep);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover{ background: var(--yellow-deep); }
  button:active{ transform: translateY(1px); }
  button:disabled{
    background: #EAD9A0;
    color: rgba(14,46,41,0.55);
    cursor: not-allowed;
  }

  .banner{
    display:none;
    background: #E8F4EE;
    border: 1px solid #BEDFCC;
    color: var(--ok);
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 20px;
    align-items:center;
    gap: 10px;
  }
  .banner.show{ display:flex; }

  .demo-note{
    text-align:center;
    font-size: 11.5px;
    color: #A7B3AD;
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>

    <div class="header-text">
      <h1>Registro de Profesionales</h1>
      <p>More than nutrition, Medtrition®</p>
    </div>
  </div>

  <form id="regForm" onsubmit="return false;">
    <div class="banner" id="successBanner">✓ Registro guardado correctamente.</div>

    <div class="field">
      <label for="nombres">Nombres</label>
      <input type="text" id="nombres" required>
    </div>

    <div class="field">
      <label for="cedula">Cédula</label>
      <input type="text" id="cedula" required inputmode="numeric">
      <div class="error-msg" id="cedulaError">⚠ Esta cédula ya está registrada.</div>
      <div class="ok-msg" id="cedulaOk">✓ Cédula disponible.</div>
    </div>

    <div class="field">
      <label for="ciudad">Ciudad</label>
      <input type="text" id="ciudad" required>
    </div>

    <div class="field">
      <label for="especialidad">Especialidad</label>
      <input type="text" id="especialidad" required>
    </div>

    <div class="field">
      <label for="institucion">Institución donde labora</label>
      <input type="text" id="institucion" required>
    </div>

    <div class="field">
      <label for="correo">Correo</label>
      <input type="email" id="correo" required>
    </div>

    <div class="field">
      <label for="celular">Celular</label>
      <input type="tel" id="celular" required inputmode="numeric">
    </div>

    <button type="submit" id="submitBtn">Registrar</button>
  </form>

  <div class="demo-note">
    Conectado a Google Sheets vía Apps Script.
  </div>
</div>

<script>
  // 👉 Reemplaza esto con la URL de tu Web App de Apps Script (paso 4 de las instrucciones)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzx7XisDTAhzcRvNISJ06yfwQnEbOnKV1q1-Ds7WmHTvyxmhPbPaLf7vR6m6txjKgw5kw/exec";
 

  const cedulaInput = document.getElementById('cedula');
  const cedulaError = document.getElementById('cedulaError');
  const cedulaOk = document.getElementById('cedulaOk');
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('regForm');
  const banner = document.getElementById('successBanner');

  let cedulaDuplicada = false;
  let checkingCedula = false;

  async function callBackend(payload){
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      // text/plain evita el preflight CORS que Apps Script no maneja bien
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function checkCedula(){
    const val = cedulaInput.value.trim();
    cedulaError.classList.remove('show');
    cedulaOk.classList.remove('show');
    cedulaInput.classList.remove('error');
    cedulaDuplicada = false;

    if(val.length === 0) return;

    checkingCedula = true;
    try{
      const data = await callBackend({ action: "check", cedula: val });
      if(data.exists){
        cedulaError.classList.add('show');
        cedulaInput.classList.add('error');
        cedulaDuplicada = true;
      } else {
        cedulaOk.classList.add('show');
      }
    } catch(err){
      console.error("Error consultando cédula:", err);
    } finally {
      checkingCedula = false;
    }
  }

  cedulaInput.addEventListener('blur', checkCedula);
  cedulaInput.addEventListener('input', () => {
    cedulaError.classList.remove('show');
    cedulaOk.classList.remove('show');
    cedulaInput.classList.remove('error');
  });

  form.addEventListener('submit', async () => {
    await checkCedula();
    if(cedulaDuplicada){
      cedulaInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Guardando...";

    try{
      const data = await callBackend({
        action: "save",
        nombres: document.getElementById('nombres').value.trim(),
        cedula: cedulaInput.value.trim(),
        ciudad: document.getElementById('ciudad').value.trim(),
        especialidad: document.getElementById('especialidad').value.trim(),
        institucion: document.getElementById('institucion').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        celular: document.getElementById('celular').value.trim()
      });

      if(data.success){
        banner.classList.add('show');
        form.reset();
        cedulaOk.classList.remove('show');
        setTimeout(() => banner.classList.remove('show'), 4000);
      } else if(data.exists){
        cedulaError.classList.add('show');
        cedulaInput.classList.add('error');
        cedulaInput.focus();
      } else if(data.error){
        alert("Error del servidor al guardar:\n\n" + (data.message || JSON.stringify(data)));
      } else {
        alert("Respuesta inesperada del servidor:\n\n" + JSON.stringify(data));
      }
    } catch(err){
      console.error("Error guardando registro:", err);
      alert("No se pudo guardar el registro.\n\nDetalle técnico: " + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Registrar";
    }
  });
</script>

</body>
</html>
